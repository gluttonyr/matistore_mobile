server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Hashed bundles and assets never change: cache them for a year.
  location /_expo/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Single-page app: every app route (/user_chats/..., /home) is served by index.html,
  # which must never be cached so a new deploy is picked up at once.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
