server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Hashed bundles and assets never change: cache them for a year.
  location /_expo/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # The app itself, never cached so a new deploy is picked up at once.
  location = / {
    add_header Cache-Control "no-cache";
    try_files /index.html =404;
  }

  # Any other URL (a reload on /home, /user_chats/...) goes back to "/": the client and admin homes
  # share the URL /home, so the start page must pick the right space from the user's role.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri @start;
  }
  location @start {
    return 302 /;
  }
}
